packages:
  - .
  - apps/*
  - packages/*
nodeLinker: hoisted
# Pin a single React across the workspace. Mobile (Expo SDK 54) requires exactly
# 19.1.0; without this, desktop's range could resolve a second copy and break the
# test runtime with a dual-React null dispatcher. Keep in sync with apps/mobile.
overrides:
  react: 19.1.0
  react-dom: 19.1.0
allowBuilds:
  core-js: true
  electron: true
  electron-winstaller: true
  esbuild: true
  keytar: true
patchedDependencies:
  '@react-navigation/bottom-tabs@7.16.2': patches/@react-navigation__bottom-tabs@7.16.2.patch
  '@react-navigation/elements@2.9.19': patches/@react-navigation__elements@2.9.19.patch
  react-native-screens@4.16.0: patches/react-native-screens@4.16.0.patch
