# fly.toml app configuration file generated for paycheck-planner-api-dev
#
# See https://fly.io/docs/reference/configuration/ for information about this file.
#

app = 'paycheck-planner-api-dev'
primary_region = 'iad'

[build]
  dockerfile = 'apps/api/Dockerfile'

[env]
  PORT = '8080'
  NODE_ENV = 'development'
  CURRENCY_API_URL = 'https://api.frankfurter.app/latest'
  CURRENCY_REQUEST_TIMEOUT_MS = '8000'
  API_AUTH_MODE = 'none'
  API_REQUIRE_AUTH = 'false'
  API_RATE_LIMIT_WINDOW_MS = '60000'
  API_RATE_LIMIT_MAX_REQUESTS = '120'
  API_STORAGE_BACKEND = 'memory'
# Set API_SHARED_SECRET with `fly secrets set API_SHARED_SECRET=... -a paycheck-planner-api-dev` when using shared-secret mode.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
